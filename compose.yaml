services:
  sunflower:
    build:
      context: ./
      network: host
    environment:
      - "SUNFLOWER__APIS__ICANHAZDADJOKE__HOST=${SUNFLOWER__APIS__ICANHAZDADJOKE__HOST:-icanhazdadjoke.com}"
      - "SUNFLOWER__APIS__ICANHAZDADJOKE__PATH=${SUNFLOWER__APIS__ICANHAZDADJOKE__PATH:-}"
      - "SUNFLOWER__APIS__ICANHAZDADJOKE__PORT=${SUNFLOWER__APIS__ICANHAZDADJOKE__PORT:-}"
      - "SUNFLOWER__APIS__ICANHAZDADJOKE__SCHEME=${SUNFLOWER__APIS__ICANHAZDADJOKE__SCHEME:-https}"
      - "SUNFLOWER__APPS=${SUNFLOWER__APPS:-[]}"
      - "SUNFLOWER__DEBUG=${SUNFLOWER__DEBUG:-true}"
      - "SUNFLOWER__IDENTITY__USERS__DEBUG__ID=${SUNFLOWER__IDENTITY__USERS__DEBUG__ID:-debug}"
      - "SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__LOCALES__PREFERRED=${SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__LOCALES__PREFERRED:-}" # yamllint disable-line rule:line-length
      - "SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__NAMES__DISPLAY=${SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__NAMES__DISPLAY:-Debug User}" # yamllint disable-line rule:line-length
      - "SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__PICTURES__PROFILE__URL=${SUNFLOWER__IDENTITY__USERS__DEBUG__TRAITS__PICTURES__PROFILE__URL:-}" # yamllint disable-line rule:line-length
      - "SUNFLOWER__SERVER__HOST=${SUNFLOWER__SERVER__HOST:-0.0.0.0}"
      - "SUNFLOWER__SERVER__PORT=${SUNFLOWER__SERVER__PORT:-30000}"
      - "SUNFLOWER__URLS__ORCHID__HOST=${SUNFLOWER__URLS__ORCHID__HOST:-localhost}"
      - "SUNFLOWER__URLS__ORCHID__PATH=${SUNFLOWER__URLS__ORCHID__PATH:-}"
      - "SUNFLOWER__URLS__ORCHID__PORT=${SUNFLOWER__URLS__ORCHID__PORT:-20120}"
      - "SUNFLOWER__URLS__ORCHID__SCHEME=${SUNFLOWER__URLS__ORCHID__SCHEME:-http}"
    network_mode: host
